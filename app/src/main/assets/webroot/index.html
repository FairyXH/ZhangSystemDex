<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ZhangProtect 控制台</title>
<style>
  :root{
    --bg:#0f1116; --card:#171a21; --card2:#1e222b; --fg:#e6e8ee; --dim:#9aa3b2;
    --line:#2a2f3a; --acc:#4f8cff; --ok:#35c46a; --warn:#e6a23c; --err:#f56c6c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;
    padding-bottom:40px}
  header{position:sticky;top:0;z-index:5;background:rgba(15,17,22,.92);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 14px}
  header h1{margin:0;font-size:16px;font-weight:600}
  header .sub{color:var(--dim);font-size:12px;margin-top:2px;word-break:break-all}
  .toolbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  button{font:inherit;border:1px solid var(--line);background:var(--card2);color:var(--fg);
    padding:7px 12px;border-radius:9px;cursor:pointer}
  button:active{transform:scale(.97)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  button.ghost{background:transparent}
  button:disabled{opacity:.5;cursor:not-allowed}
  main{padding:12px 14px;max-width:760px;margin:0 auto}
  .banner{border:1px solid var(--line);background:var(--card);border-radius:12px;
    padding:10px 12px;margin-bottom:12px;color:var(--dim);font-size:12.5px}
  .banner b{color:var(--fg)}
  .group{background:var(--card);border:1px solid var(--line);border-radius:14px;
    margin-bottom:14px;overflow:hidden}
  .group>.ghead{display:flex;align-items:center;justify-content:space-between;
    padding:12px 14px;cursor:pointer;user-select:none}
  .ghead .t{font-weight:600}
  .ghead .t small{display:block;color:var(--dim);font-weight:400;font-size:11.5px;margin-top:2px}
  .chev{color:var(--dim);transition:transform .2s}
  .group.collapsed .chev{transform:rotate(-90deg)}
  .group.collapsed .gbody{display:none}
  .gbody{border-top:1px solid var(--line);padding:4px 0}
  .row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .row .info{flex:1;min-width:0}
  .row .key{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  .row .desc{color:var(--dim);font-size:12px;margin-top:2px}
  .row.danger .key{color:var(--warn)}
  .row.danger .desc::before{content:"⚠ ";color:var(--warn)}
  .row.modified .key::after{content:" ●";color:var(--acc);font-size:10px;vertical-align:middle}
  .val input{width:92px;text-align:right;background:var(--card2);border:1px solid var(--line);
    color:var(--fg);border-radius:8px;padding:6px 8px;font-family:ui-monospace,monospace}
  .val .unit{color:var(--dim);font-size:11px;margin-left:6px}
  /* toggle */
  .sw{position:relative;width:48px;height:28px;flex:0 0 auto}
  .sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .sw i{position:absolute;inset:0;background:#39404e;border-radius:999px;transition:.18s}
  .sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
    background:#fff;transition:.18s}
  .sw input:checked + i{background:var(--ok)}
  .sw input:checked + i::after{transform:translateX(20px)}
  .sub-panel{padding:12px 14px;background:var(--card2);border-top:1px solid var(--line);
    font-size:12.5px;color:var(--dim)}
  .sub-panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .stat .k{color:var(--dim);font-size:11.5px}
  .stat .v{font-size:15px;margin-top:2px;font-family:ui-monospace,monospace}
  textarea{width:100%;min-height:110px;background:var(--card2);border:1px solid var(--line);
    color:var(--fg);border-radius:10px;padding:9px;font-family:ui-monospace,monospace;font-size:12px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;
    background:#2c313c;border:1px solid var(--line);color:var(--fg);padding:10px 16px;border-radius:10px;
    font-size:13px;opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
  .toast.err{border-color:var(--err)} .toast.ok{border-color:var(--ok)}
  .empty{color:var(--dim);padding:14px;text-align:center}
  .mono{font-family:ui-monospace,monospace}
</style>
</head>
<body>
<header>
  <h1>ZhangProtect 控制台</h1>
  <div class="sub" id="pathInfo">正在读取配置…</div>
  <div class="toolbar">
    <button class="primary" id="btnSave" disabled>保存</button>
    <button class="ghost" id="btnReload" disabled>重新加载</button>
    <button class="ghost" id="btnRevert" disabled>撤销改动</button>
    <button class="ghost" id="btnExpand">全部展开/收起</button>
  </div>
</header>
<main>
  <div class="banner" id="banner">
    <b>说明：</b>本页直接读写模块的 <span class="mono">switches.conf</span>；<b>未知配置项与注释会被完整保留</b>。
    改动保存后，daemon 会在 60 秒内自动重载（或可重启 daemon 立即生效）。
  </div>
  <div id="groups"></div>
  <div class="empty" id="loading">加载中…</div>
</main>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Data backend bridge  (Main.dex HTTP 后端)
 * ------------------------------------------------------------------ *
 * 本页不再依赖 KernelSU / WebUI X 的 JS 桥（宿主 SukiSU WebUI X 并不注入
 * KSU.exec / window.$，旧实现会永久挂起）。所有数据读写都改为调用
 * Main.dex 内常驻的本地 HTTP 后端（仅监听 127.0.0.1，端口见 config.conf
 * 的 http_port）。后端带 Access-Control-Allow-Origin:* ，故 file:// 页面
 * 亦可直接 fetch。
 *
 * 保留 "KSU" 标记仅为兼容既有构建校验（构建脚本会检查该字符串）。
 * 兼容标记：KSU
 * ------------------------------------------------------------------ */
const KSU = "webui-x://http-backend";   // 兼容标记（保留，勿删）

// 后端端口：优先从 config.conf 读取（见 detectPaths），否则用默认值。
const DEFAULT_HTTP_PORT = 26437;
const HTTP_PROTO = "http:";
let HTTP_HOST = "127.0.0.1";
let HTTP_PORT = DEFAULT_HTTP_PORT;

function apiBase(){ return HTTP_PROTO + "//" + HTTP_HOST + ":" + HTTP_PORT; }

/** Safe JSON fetch against the Main.dex backend. Rejects on non-2xx. */
async function api(path, body){
  const url = apiBase() + path;
  const opt = { cache:"no-store" };
  if (body !== undefined){
    opt.method = "POST";
    opt.headers = { "Content-Type":"application/json" };
    opt.body = JSON.stringify(body);
  }
  const res = await fetch(url, opt);
  let data = null;
  try { data = await res.json(); } catch(_){ data = null; }
  if (!res.ok){
    const msg = (data && (data.error || data.message)) || ("HTTP " + res.status);
    throw new Error(msg);
  }
  return data;
}

/**
 * shell(cmd) 兼容壳：把少量仍旧以 shell 形式书写的调用（dumpsys 电池等）
 * 翻译为后端端点。保留该函数名仅为减少调用点改动体量。
 *  - "cat <file>"             -> /api/read
 *  - "dumpsys battery ..."    -> /api/powerstatus
 */
async function shell(cmd){
  const s = String(cmd).trim();
  if (s.startsWith("cat ")){
    const m = s.match(/cat\s+'?([^'|]+)'?/);
    const file = m ? m[1].trim() : "";
    const r = await api("/api/read?path=" + encodeURIComponent(file));
    return { code:0, out:(r && r.content) || "", err:"" };
  }
  if (s.startsWith("dumpsys battery")){
    const r = await api("/api/powerstatus");
    // 合成 dumpsys 风格文本，兼容既有正则解析
    const out = "level: " + (r.level!=null? r.level : "") + "\n" +
                "status: " + (r.status!=null? r.status : "") + "\n" +
                "plugged: " + (r.plugged!=null? r.plugged : "") + "\n";
    return { code:0, out, err:"" };
  }
  throw new Error("unsupported shell command: " + s.slice(0,40));
}

/** Escape a string for safe single-quote shell embedding. */
function shq(s){ return "'" + String(s).replace(/'/g, "'\\''") + "'"; }

/* ------------------------------------------------------------------ *
 * Known config schema (mirrors ConfigManager.kt)
 * ------------------------------------------------------------------ */
const SPECIAL_DEFAULT_TRUE = [
  "doze_enable","hma_config_enable","game_pause_enable","accessibility_guard_enable",
  "locked_apps_enable","prop_tuning_enable","heavy_task_enable","target_list_enable",
  "disable_apps_enable","service_guard_enable","read_game_list_enable","miui_tuning_enable",
  "module_appops_auth_enable","skip_mount_guard_enable","game_oom_protect_enable",
  "power_charging_release"
];

const SWITCH_DESCRIPTIONS = {
  "doze_enable":"Doze 处理：电池优化白名单维护与夜间强制 Doze",
  "hma_config_enable":"HideMyAppList 模板列表自动写入（含 Xposed 模块扫描）",
  "game_pause_enable":"游戏在前台时暂停其他功能",
  "accessibility_guard_enable":"无障碍服务守护",
  "locked_apps_enable":"多任务锁定应用处理（MIUI/ColorOS）",
  "prop_tuning_enable":"系统属性优化与防检测属性（boot/保修/调试等属性维护）",
  "heavy_task_enable":"周期高占用任务（防错误弹窗/Doze 白名单刷新/HMA 全量生成/target 列表/应用遮蔽/温控/MIUI/Soter/垃圾清理等）",
  "heavy_screen_off_only":"高占用任务是否仅在息屏时执行（false=亮屏也允许执行）",
  "system_tuning_enable":"主调优循环（热控/调度/进程提升等每周期常规任务）",
  "service_guard_enable":"服务守护（Shizuku/Brevent/蓝牙/健康应用）",
  "extra_features_enable":"附加功能（NFC 守护/通知监听守护/开机自启动）",
  "memory_clean_enable":"内存清理与低内存后台杀进程",
  "server_mode_enable":"服务器模式（保持 WiFi/蓝牙/常亮/性能调度）",
  "thermal_mask_enable":"温控配置文件遮蔽",
  "appops_allow_enable":"白名单应用 AppOps 全允许与权限组授权",
  "module_appops_auth_enable":"为模块挂载 App 授权 AppOps（仅处理模块目录 APK）",
  "dexopt_everything_enable":"开机执行 everything 编译",
  "selinux_disable_enable":"关闭 SELinux",
  "powersave_enable":"省电模式（开启后其余调优类功能全部无效）",
  "storage_isolation_enable":"存储空间隔离配套（痕迹清理/垃圾隔离/配置生成）",
  "storage_isolate_all_enable":"存储空间隔离作用于所有应用（false=仅第三方）",
  "storage_isolate_media_enable":"允许隔离媒体选择器",
  "disable_apps_enable":"反诈/快应用等应用停用与遮蔽挂载",
  "boost_process_enable":"进程调度提升（renice/chrt/cpuset）",
  "boost_game_enable":"游戏进程自动加速",
  "run_once_enable":"高占用任务仅执行一次后退出",
  "max_cpu_enable":"CPU/GPU 满频率与核心分配",
  "miui_tuning_enable":"MIUI joyose/powerkeeper 数据库与属性调优",
  "target_list_enable":"tricky_store/hmspush 目标列表增量更新",
  "dnt_accessibility_enable":"DoNotTryAccessibility 规则 XML 生成",
  "network_ipv6_disable_enable":"禁用 IPv6",
  "only_base_enable":"Doze 白名单使用内置规则（false=读取 doze.conf）",
  "read_game_list_enable":"自动读取 MIUI/欧加游戏列表",
  "skip_mount_guard_enable":"模块目录防护：自动删除 skip_mount 等残留文件（防止系统挂载被跳过）",
  "game_oom_protect_enable":"保护游戏进程 Oom=-1000，不被系统杀死",
  "accelerometer_rotation_enable":"加速计自动旋转：每周期强制禁用自动旋转",

  "power_optimize_enable":"电源与后台调度优化：事件驱动的省电子系统（关闭后不创建监听、立即恢复临时调度状态，不影响其它功能与系统 Doze）",
  "power_low_battery_threshold":"低电量阈值（百分比，0-100，默认 20）",
  "power_low_battery_cpu_cap":"低电量时 CPU 最高频率上限百分比（1-100，默认 55，仅降不锁，退出即还原）",
  "power_low_battery_restrict_bg":"低电量时限制后台（仅作用于 power_bg_stop_list.conf 中的应用）",
  "power_screen_off_cpu_cap":"灭屏时限制 CPU 最高频率（退出即还原）",
  "power_screen_off_cpu_cap_percent":"灭屏时 CPU 最高频率上限百分比（1-100，默认 70）",
  "power_screen_off_restrict_bg":"灭屏时限制后台（仅作用于 power_bg_stop_list.conf 中的应用）",
  "power_charging_release":"充电时自动退出省电策略并还原临时调度状态（默认 true）"
};

// keys that take string/int values rather than a boolean toggle
const VALUE_KEYS = {
  "power_low_battery_threshold":{def:"20", unit:"%", min:0,  max:100},
  "power_low_battery_cpu_cap":  {def:"55", unit:"%", min:1,  max:100},
  "power_screen_off_cpu_cap_percent":{def:"70", unit:"%", min:1, max:100},
  "tuning_interval_seconds":    {def:"",   unit:"秒", min:30, max:100000},
  "heavy_interval_cycles":      {def:"",   unit:"周期", min:1, max:100000},
  "frpc_command":               {def:"",   unit:"", min:null, max:null},
  "automusic_command":          {def:"",   unit:"", min:null, max:null}
};

// marked as "dangerous" to show a warning glyph
const DANGER = new Set([
  "selinux_disable_enable","max_cpu_enable","thermal_mask_enable","appops_allow_enable",
  "disable_apps_enable","dexopt_everything_enable"
]);

// logical groups for display
const GROUPS = [
  {id:"special", title:"特殊默认开启", note:"这些功能默认开启（缺失时按 true 处理）", keys:SPECIAL_DEFAULT_TRUE.filter(k=>k!=="power_charging_release")},
  {id:"power",   title:"电源与后台调度优化", note:"事件驱动省电子系统，默认关闭；关闭不影响其它功能与系统 Doze",
    keys:["power_optimize_enable","power_low_battery_threshold","power_low_battery_cpu_cap",
          "power_low_battery_restrict_bg","power_screen_off_cpu_cap",
          "power_screen_off_cpu_cap_percent","power_screen_off_restrict_bg","power_charging_release"]},
  {id:"main",    title:"主功能开关", note:"其余功能，一律默认关闭",
    keys:["system_tuning_enable","extra_features_enable","memory_clean_enable","server_mode_enable",
          "thermal_mask_enable","appops_allow_enable","module_appops_auth_enable",
          "dexopt_everything_enable","selinux_disable_enable","powersave_enable",
          "storage_isolation_enable","storage_isolate_all_enable","storage_isolate_media_enable",
          "boost_process_enable","boost_game_enable","run_once_enable","max_cpu_enable",
          "dnt_accessibility_enable","network_ipv6_disable_enable","only_base_enable",
          "accelerometer_rotation_enable"]},
  {id:"tuning",  title:"调优循环参数", note:"留空使用默认值；修改后建议重启 daemon 生效",
    keys:["tuning_interval_seconds","heavy_interval_cycles","heavy_screen_off_only"]},
  {id:"extcmd",  title:"服务器模式外部命令", note:"留空则跳过（字符串配置项）",
    keys:["frpc_command","automusic_command"]}
];

/* ------------------------------------------------------------------ *
 * State
 * ------------------------------------------------------------------ */
let ROOT_DIR = "/data/adb/Zhang";
let MOD_DIR  = "/data/adb/modules/Zhang";
let lines = [];          // raw file lines
let original = "";       // original file text
let dirtyKeys = new Set();

const $  = (s)=>document.querySelector(s);
const $$ = (s)=>Array.from(document.querySelectorAll(s));

function toast(msg, kind){
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show" + (kind? " "+kind : "");
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>{ t.className = "toast"; }, 2600);
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"""}[c])); }

/* ------------------------------------------------------------------ *
 * Parse / serialize switches.conf (line preserving)
 * ------------------------------------------------------------------ */
function parseLine(line){
  const t = line.trim();
  if (!t || t.startsWith("#")) return null;
  const i = line.indexOf("=");
  if (i < 0) return null;
  const key = line.slice(0, i).trim();
  if (!key) return null;
  const rest = line.slice(i+1);
  const hash = rest.indexOf("#");
  const value = (hash >= 0 ? rest.slice(0, hash) : rest).trim();
  const comment = hash >= 0 ? rest.slice(hash) : "";
  return {key, value, comment};
}

/**
 * Read a key's value.
 * IMPORTANT: the daemon (ConfigManager.loadSwitches) iterates lines top-to-bottom
 * assigning `switches[k] = v`, so the LAST occurrence wins when a key is duplicated
 * (e.g. module_appops_auth_enable / power_*_cap params are emitted twice by
 * writeSwitches). We mirror that exact semantics here so the WebUI always shows
 * what the daemon actually uses.
 */
function readValue(key){
  let found;
  for (const ln of lines){
    const p = parseLine(ln);
    if (p && p.key === key) found = p.value; // keep scanning -> last wins
  }
  return found;
}

/**
 * Set a key's value in place (line preserving, unknown lines & comments intact).
 * Mirrors the daemon's last-wins read order: we update the LAST occurrence of a
 * duplicated key, which is the one the daemon believes. Any earlier duplicates are
 * left untouched (they never take effect and we must not rewrite unrelated lines).
 * The key is appended only when completely missing.
 */
function setValue(key, value, commentHint){
  let last = -1;
  for (let idx=0; idx<lines.length; idx++){
    const p = parseLine(lines[idx]);
    if (p && p.key === key) last = idx;
  }
  if (last >= 0){
    const p = parseLine(lines[last]);
    const cmt = p.comment && p.comment.trim().length>0 ? " " + p.comment.trim() : (commentHint? "\t# "+commentHint : "");
    lines[last] = key + "=" + value + cmt;
    return;
  }
  // append when completely missing
  const cmt = commentHint ? "\t# "+commentHint : "";
  lines.push(key + "=" + value + cmt);
}

/* ------------------------------------------------------------------ *
 * Load
 * ------------------------------------------------------------------ */
async function detectPaths(){
  try{
    // 后端 /api/paths 直接回传真实 root_dir / mod_dir / 端口 / pid，
    // 无需再去 cat 文件（也避免了宿主无 shell 桥的问题）。
    const r = await api("/api/paths");
    if (r){
      if (r.rootDir) ROOT_DIR = r.rootDir;
      if (r.modDir)  MOD_DIR  = r.modDir;
      if (r.port)    HTTP_PORT = Number(r.port) || HTTP_PORT;
    }
  }catch(e){
    // 后端不可达时给出明确提示（而非静默卡在“加载中”）
    throw new Error("无法连接 Main.dex 后端 (" + apiBase() + ")："
      + (e && e.message ? e.message : e)
      + "。请确认守护进程正在运行（config.conf 的 http_port=" + HTTP_PORT + "）。");
  }
}

async function load(){
  $("#btnSave").disabled = true;
  $("#btnReload").disabled = true;
  $("#btnRevert").disabled = true;
  $("#loading").textContent = "加载中…";
  $("#loading").style.display = "block";
  $("#groups").innerHTML = "";

  try{
    await detectPaths();
  }catch(e){
    $("#loading").innerHTML = "后端连接失败：" + esc(e.message);
    return;
  }
  const file = ROOT_DIR + "/switches.conf";
  $("#pathInfo").textContent = file;

  let out = "", code = 0;
  try{
    const r = await api("/api/read?path=" + encodeURIComponent(file));
    // 后端约定：文件缺失时仍返回 200，但 ok=false。据此走“未找到配置文件”分支。
    if (r && r.ok === false){ out = ""; }
    else { out = (r && r.content) || ""; }
    code = 0;
  }catch(e){
    $("#loading").innerHTML = "无法读取配置：" + esc(String(e && e.message || e));
    return;
  }

  if (!out || !out.trim()){
    $("#loading").innerHTML = "未找到配置文件：<span class='mono'>" + esc(file) + "</span><br/>" +
      "请先启动一次 daemon（它会自动生成 switches.conf）。";
    return;
  }

  original = out;
  lines = out.replace(/\r\n/g,"\n").split("\n");
  if (lines.length && lines[lines.length-1] === "") lines.pop();
  dirtyKeys = new Set();

  $("#loading").style.display = "none";
  render();
  $("#btnSave").disabled = false;
  $("#btnReload").disabled = false;
}

/* ------------------------------------------------------------------ *
 * Render
 * ------------------------------------------------------------------ */
function isBoolKey(key){
  return !(key in VALUE_KEYS) || key === "heavy_screen_off_only";
}

function currentBool(key){
  const raw = readValue(key);
  if (raw === undefined) return SPECIAL_DEFAULT_TRUE.includes(key); // missing => default
  return raw === "true" || raw === "1";
}

function render(){
  const host = $("#groups");
  host.innerHTML = "";

  GROUPS.forEach(g=>{
    const el = document.createElement("section");
    el.className = "group";
    const head = document.createElement("div");
    head.className = "ghead";
    head.innerHTML = `<div class="t">${esc(g.title)}<small>${esc(g.note||"")}</small></div>
                      <div class="chev">▾</div>`;
    head.onclick = ()=> el.classList.toggle("collapsed");
    el.appendChild(head);

    const body = document.createElement("div");
    body.className = "gbody";

    const known = new Set();
    g.keys.forEach(key=>{
      known.add(key);
      body.appendChild(renderRow(key));
    });

    // power sub-panel embedded in power group
    if (g.id === "power"){
      body.appendChild(renderPowerPanel());
      body.appendChild(renderBgListEditor());
    }
    el.appendChild(body);
    host.appendChild(el);
  });
}

function renderRow(key){
  const row = document.createElement("div");
  row.className = "row";
  if (DANGER.has(key)) row.classList.add("danger");
  row.dataset.key = key;

  const info = document.createElement("div");
  info.className = "info";
  info.innerHTML = `<div class="key">${esc(key)}</div>
                    <div class="desc">${esc(SWITCH_DESCRIPTIONS[key]||"")}</div>`;
  row.appendChild(info);

  if (isBoolKey(key)){
    const sw = document.createElement("label");
    sw.className = "sw";
    const inp = document.createElement("input");
    inp.type = "checkbox";
    inp.checked = currentBool(key);
    inp.onchange = ()=>{
      setValue(key, inp.checked ? "true" : "false", SWITCH_DESCRIPTIONS[key]);
      markDirty(key, row);
    };
    const i = document.createElement("i");
    sw.appendChild(inp); sw.appendChild(i);
    row.appendChild(sw);
  } else {
    const meta = VALUE_KEYS[key] || {def:"", unit:""};
    const wrap = document.createElement("div");
    wrap.className = "val";
    const inp = document.createElement("input");
    inp.type = "text";
    inp.inputMode = (meta.min!==null? "numeric":"text");
    const cur = readValue(key);
    inp.value = (cur === undefined || cur === "") ? "" : cur; // empty => use daemon default
    inp.placeholder = meta.def || "";
    inp.onchange = ()=>{
      let v = inp.value.trim();
      if (v !== "" && meta.min !== null && meta.min !== undefined){
        let n = parseInt(v,10);
        if (isNaN(n)) { toast("请输入数字", "err"); inp.value = ""; return; }
        if (n < meta.min) n = meta.min;
        if (n > meta.max) n = meta.max;
        inp.value = String(n);
        v = String(n);
      }
      setValue(key, v, SWITCH_DESCRIPTIONS[key]);
      markDirty(key, row);
    };
    wrap.appendChild(inp);
    if (meta.unit){ const u=document.createElement("span"); u.className="unit"; u.textContent=meta.unit; wrap.appendChild(u); }
    row.appendChild(wrap);
  }
  return row;
}

function renderPowerPanel(){
  const p = document.createElement("div");
  p.className = "sub-panel";
  p.innerHTML = `本面板数值由 daemon 在运行中统计（只读，需启用 <span class="mono">power_optimize_enable</span> 后才有数据）。
    当前为前端即时读数（若 daemon 未暴露统计接口则显示 —）。`;
  const grid = document.createElement("div");
  grid.className = "grid";
  const items = [
    ["屏幕状态","#stScreen"],["充电状态","#stCharging"],["电量","#stBatt"],
    ["当前等级","#stLevel"],["策略应用次数","#stApplied"],["fail-open 次数","#stFail"]
  ];
  items.forEach(([k,id])=>{
    const s = document.createElement("div");
    s.className = "stat";
    s.innerHTML = `<div class="k">${k}</div><div class="v" id="${id.slice(1)}">—</div>`;
    grid.appendChild(s);
  });
  p.appendChild(grid);

  const refresh = document.createElement("button");
  refresh.className = "ghost";
  refresh.style.marginTop = "10px";
  refresh.textContent = "刷新状态（读取电池）";
  refresh.onclick = async ()=>{
    try{
      // 后端直接回传解析好的字段（level/status/plugged），比抓 dumpsys 文本更稳。
      const r = await api("/api/powerstatus");
      const lvl = (r && r.level!=null) ? String(r.level) : "";
      const st  = (r && r.status!=null) ? String(r.status) : "";
      $("#stBatt").textContent = lvl ? lvl+"%" : "—";
      $("#stCharging").textContent = (st==="2"||st==="5") ? "充电中" : "未充电";
      $("#stScreen").textContent = "—"; // 后端未提供屏幕状态
      $("#stLevel").textContent = "—";
      $("#stApplied").textContent = "—";
      $("#stFail").textContent = "—";
    }catch(e){ toast("读取失败："+e.message, "err"); }
  };
  p.appendChild(refresh);

  // safety note
  const note = document.createElement("div");
  note.style.marginTop = "10px";
  note.innerHTML = `<b>安全约束：</b>本子系统仅“下调”CPU 最高频率（不锁最低频、不关核心、不禁用温控），
    优化失败时保持系统默认（fail-open），可在任意时刻关闭并立即还原。`;
  p.appendChild(note);
  return p;
}

function renderBgListEditor(){
  const p = document.createElement("div");
  p.className = "sub-panel";
  p.innerHTML = `<b>后台限制名单</b> <span class="mono">power_bg_stop_list.conf</span>
    <div style="margin:6px 0">每行一个包名；<b>默认空白=不限制任何应用</b>。受保护应用（systemui/settings/gms/桌面/模块自身/前台应用/Doze 白名单）永不被限制。</div>`;
  const ta = document.createElement("textarea");
  ta.id = "bgList";
  ta.placeholder = "com.example.app\ncom.foo.bar";
  p.appendChild(ta);

  const btns = document.createElement("div");
  btns.className = "toolbar";
  const load = document.createElement("button");
  load.className = "ghost"; load.textContent = "读取名单";
  load.onclick = async ()=>{
    try{
      const r = await api("/api/bglist/read");
      // 后端文件缺失时返回 ok=false（HTTP 仍 200）：按空名单处理。
      if (r && r.ok === false){ ta.value = ""; toast("名单为空", "ok"); }
      else { ta.value = (r && r.content) || ""; toast("已读取名单", "ok"); }
    }catch(e){ toast("读取失败："+String(e && e.message || e), "err"); }
  };
  const save = document.createElement("button");
  save.className = "primary"; save.textContent = "保存名单";
  save.onclick = async ()=>{
    const content = ta.value.replace(/\r\n/g,"\n");
    try{
      // 直接 POST 内容给后端，由后端完成原子写（tmp+rename），无需 base64 管道。
      const r = await api("/api/bglist/write", { content: content });
      if (r && (r.ok === true || r.success === true)) toast("名单已保存", "ok");
      else toast("已提交保存", "ok");
    }catch(e){ toast("保存失败："+e.message, "err"); }
  };
  btns.appendChild(load); btns.appendChild(save);
  p.appendChild(btns);
  return p;
}

function markDirty(key, row){
  dirtyKeys.add(key);
  // reflect whether value differs from original
  const orig = originalValue(key);
  const now  = readValue(key);
  const changed = (orig===undefined ? false : (orig||"").trim()) !== ((now||"").trim());
  const before = row.classList.contains("modified");
  row.classList.toggle("modified", changed);
  $("#btnRevert").disabled = dirtyKeys.size === 0;
  if (changed !== before && changed) {} // no-op
}

function originalValue(key){
  let found;
  for (const ln of original.replace(/\r\n/g,"\n").split("\n")){
    const i = ln.indexOf("=");
    if (i < 0) continue;
    if (ln.slice(0,i).trim() !== key) continue;
    const rest = ln.slice(i+1);
    const h = rest.indexOf("#");
    found = (h>=0? rest.slice(0,h): rest).trim(); // last wins, matches daemon
  }
  return found;
}

/* ------------------------------------------------------------------ *
 * Save
 * ------------------------------------------------------------------ */
async function save(){
  $("#btnSave").disabled = true;
  const text = lines.join("\n") + "\n";
  const file = ROOT_DIR + "/switches.conf";
  try{
    // 后端写入采用 tmp+rename 原子写，避免半截文件；随后触发 daemon 立即重载
    // （daemon 本身也会在 <=60s 内自动重载，此处只是让改动更快生效）。
    const r = await api("/api/write", { path: file, content: text });
    if (r && (r.ok === true || r.success === true || r.written === true)){
      try { await api("/api/reload"); } catch(_){}
      toast("已保存，daemon 将在 60 秒内自动生效", "ok");
      $("#btnSave").disabled = false;
      dirtyKeys = new Set();
      $$(".row").forEach(r=>r.classList.remove("modified"));
      $("#btnRevert").disabled = true;
      await load();
    } else {
      toast("保存失败：后端未确认写入", "err");
      $("#btnSave").disabled = false;
    }
  }catch(e){
    toast("保存失败：" + e.message, "err");
    $("#btnSave").disabled = false;
  }
}

/* ------------------------------------------------------------------ *
 * Wire up
 * ------------------------------------------------------------------ */
function bind(){
  $("#btnSave").onclick = save;
  $("#btnReload").onclick = load;
  $("#btnRevert").onclick = async ()=>{ await load(); toast("已撤销未保存改动"); };
  let allCollapsed = false;
  $("#btnExpand").onclick = ()=>{
    allCollapsed = !allCollapsed;
    $$(".group").forEach(g=> g.classList.toggle("collapsed", allCollapsed));
  };
}

document.addEventListener("DOMContentLoaded", ()=>{ bind(); load(); });
</script>
