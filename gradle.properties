# 【不要写死 android.aapt2FromMavenOverride】
# 该属性与构建机器平台强绑定：Linux proot 需要 qemu 包装脚本，
# Windows / macOS 必须不设置，否则 AGP 会去打开不存在的 /opt/... 而构建失败。
# 自动探测见 build.gradle.kts；需要手动指定时二选一：
#   -Paapt2Override=/path/to/aapt2        或        AAPT2_WRAPPER=/path/to/aapt2
